<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 · Dock / motherboard</title>
<link rel="stylesheet" href="_base.css">
<style>
  .board{ position:relative; width:min(960px,92vw); height:560px; }
  .core{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:230px; height:150px; border:1.8px solid var(--accent); border-radius:16px;
    background:var(--panel); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 0 0 6px rgba(198,244,50,.04), 0 0 60px rgba(198,244,50,.10); z-index:3; }
  .core .chip{ width:42px; height:42px; border:1.6px solid var(--accent); border-radius:10px; position:relative; }
  .core .chip::before{ content:''; position:absolute; inset:9px; border:1.5px solid var(--accent); border-radius:4px; opacity:.5; }
  .core .lbl{ font:700 12px 'JetBrains Mono'; letter-spacing:2px; color:var(--accent); }
  .core small{ color:var(--dim); font-size:10px; letter-spacing:1px; }
  .mod{ position:absolute; width:188px; border:1.4px solid rgba(255,255,255,.2); border-radius:13px;
    background:var(--panel); padding:14px 16px; opacity:0; z-index:2; }
  .mod .top{ font:600 10px 'JetBrains Mono'; letter-spacing:2px; color:var(--accent); margin-bottom:9px; }
  .mod .prov{ font:600 18px 'Archivo',sans-serif; }
  .mod .pin{ position:absolute; width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  /* connectors */
  .wire{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:1; }
  @keyframes dockIn{ from{ opacity:0; } to{ opacity:1; } }
  .m0{ left:50%; top:24px; transform:translateX(-50%) translateY(-26px); animation:dockIn .6s .2s forwards, slideDownTop .6s .2s forwards; }
  .m1{ right:8px; top:120px; transform:translateX(26px); animation:dockIn .6s .5s forwards, slideLeft .6s .5s forwards; }
  .m2{ right:8px; bottom:120px; transform:translateX(26px); animation:dockIn .6s .8s forwards, slideLeft .6s .8s forwards; }
  .m3{ left:50%; bottom:24px; transform:translateX(-50%) translateY(26px); animation:dockIn .6s 1.1s forwards, slideUpBot .6s 1.1s forwards; }
  .m4{ left:8px; top:50%; transform:translateX(-26px) translateY(-50%); animation:dockIn .6s 1.4s forwards, slideRight .6s 1.4s forwards; }
  @keyframes slideDownTop{ from{transform:translateX(-50%) translateY(-46px);} to{transform:translateX(-50%) translateY(0);} }
  @keyframes slideUpBot{ from{transform:translateX(-50%) translateY(46px);} to{transform:translateX(-50%) translateY(0);} }
  @keyframes slideLeft{ from{transform:translateX(46px);} to{transform:translateX(0);} }
  @keyframes slideRight{ from{transform:translateX(-46px) translateY(-50%);} to{transform:translateX(0) translateY(-50%);} }
  .dash{ stroke:var(--accent); stroke-width:2; stroke-dasharray:5 8; fill:none; opacity:.85;
    animation:flow .5s linear infinite; }
  @keyframes flow{ to{ stroke-dashoffset:-13; } }
</style></head>
<body><div class="stage">
  <div class="caption"><div class="kicker">02 — ENGINE</div><h2>Plug in the capabilities.</h2>
    <p>Your product is the core. Every capability it needs docks straight in, powered by the best provider for the job.</p></div>
  <div class="tag">[ DOCK / MOTHERBOARD ]</div>
  <div class="board">
    <svg class="wire" viewBox="0 0 960 560" preserveAspectRatio="none">
      <path class="dash" d="M480 116 V210"/>
      <path class="dash" d="M772 168 H600"/>
      <path class="dash" d="M772 392 H600"/>
      <path class="dash" d="M480 444 V350"/>
      <path class="dash" d="M188 280 H360"/>
    </svg>
    <div class="core"><div class="chip"></div><div class="lbl">YOUR PRODUCT</div><small>the core</small></div>
    <div class="mod m0"><div class="top">ACCOUNTS</div><div class="prov" data-providers="Clerk|Auth0|Firebase|Better Auth"></div><span class="pin" style="left:50%;bottom:-5px;transform:translateX(-50%)"></span></div>
    <div class="mod m1"><div class="top">PAYMENTS</div><div class="prov" data-providers="Stripe|PayPal|Shopify|RevenueCat"></div><span class="pin" style="left:-5px;top:50%;transform:translateY(-50%)"></span></div>
    <div class="mod m2"><div class="top">CONTENT</div><div class="prov" data-providers="Sanity|Contentful|Strapi|Notion"></div><span class="pin" style="left:-5px;top:50%;transform:translateY(-50%)"></span></div>
    <div class="mod m3"><div class="top">HOSTING</div><div class="prov" data-providers="Cloudflare|AWS|Azure|GCP"></div><span class="pin" style="left:50%;top:-5px;transform:translateX(-50%)"></span></div>
    <div class="mod m4"><div class="top">AI AGENTS</div><div class="prov" data-providers="Claude|Gemini|Mistral|Ollama"></div><span class="pin" style="right:-5px;top:50%;transform:translateY(-50%)"></span></div>
  </div>
  <a class="backlink" href="./">‹ all designs</a>
</div>
<script src="_cycle.js"></script><script>startCycle();</script>
</body></html>
